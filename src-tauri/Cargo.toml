[package]
name = "tablebase"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
duckdb = { version = "1.10504.0", features = ["bundled"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlparser = "0.62.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
